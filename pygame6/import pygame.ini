import pygame
import sys
import math
import random

# Инициализация Pygame
pygame.init()

# Определение размеров экрана
WIDTH, HEIGHT = 600, 600
SCREEN_SIZE = (WIDTH, HEIGHT)

# Определение цветов
WHITE = (255, 255, 255)
BLACK = (0, 0, 0)
RED = (255, 0, 0)
GRAY = (200, 200, 200)

# Определение точек (15 точек)
points = [(75, 75), (225, 75), (375, 75),
          (75, 225), (225, 225), (375, 225),
          (75, 375), (225, 375), (375, 375),
          (150, 150), (300, 150), (450, 150),
          (150, 300), (450, 300), (300, 450)]

# Определение углов (5 углов)
angles = []

# Определение текущей выбранной точки
selected_points = []

# Флаги для отслеживания состояния игры
game_started = False
game_over = False

# Определение глобальных переменных для кнопок
restart_button = None
quit_button = None

# Флаг для отслеживания завершения головоломки
puzzle_completed = False

# Генерация 15 случайных точек
def generate_points():
    points = []
    for _ in range(15):
        x = random.randint(100, 500)
        y = random.randint(100, 500)
        points.append((x, y))
    return points

# Основной игровой цикл
def main():
    global game_started, selected_points, angles, points, game_over, restart_button, quit_button, puzzle_completed

    screen = pygame.display.set_mode(SCREEN_SIZE)
    pygame.display.set_caption("Головоломка")

    # Определение кнопок
    restart_button = pygame.Rect(200, 450, 200, 50)
    quit_button = pygame.Rect(200, 520, 200, 50)

    while True:
        for event in pygame.event.get():
            if event.type == pygame.QUIT:
                pygame.quit()
                sys.exit()
            elif event.type == pygame.MOUSEBUTTONDOWN:
                if game_started and not game_over:
                    x, y = pygame.mouse.get_pos()
                    clicked_point = find_closest_point(x, y)
                    if selected_points and clicked_point not in selected_points:
                        if len(selected_points) == 2:
                            angle = selected_points + [clicked_point]
                            if can_create_angle(angle):
                                angles.append(angle)
                                selected_points = []
                                check_solution()  # Проверка решения головоломки
                            else:
                                show_message(screen, "Неправильно")
                        elif len(selected_points) == 1 and clicked_point not in [p for angle in angles for p in angle]:
                            selected_points.append(clicked_point)
                    elif clicked_point not in selected_points:
                        selected_points.append(clicked_point)
                elif game_over:
                    if restart_button.collidepoint(event.pos):
                        game_over = False
                        initialize_game()
                    elif quit_button.collidepoint(event.pos):
                        pygame.quit()
                        sys.exit()
                else:
                    game_started = True
                    initialize_game()

        if not game_started:
            screen.fill(WHITE)
            if game_over:
                draw_game_over_screen(screen)
            else:
                draw_start_screen(screen)
            pygame.display.flip()
            continue

        screen.fill(WHITE)

        # Проверка, завершена ли головоломка
        if len(angles) == 5:
            puzzle_completed = True

        # Отрисовка всплывающего сообщения
        if puzzle_completed:
            show_message(screen, "Головоломка решена")
            game_over = True
        # Отрисовка точек
        for point in points:
            pygame.draw.circle(screen, BLACK, point, 5)

        # Отрисовка углов
        for angle in angles:
            pygame.draw.line(screen, RED, angle[0], angle[1], 2)
            pygame.draw.line(screen, RED, angle[0], angle[2], 2)

        # Отрисовка выбранных точек
        for point in selected_points:
            pygame.draw.circle(screen, GRAY, point, 8)

        pygame.display.flip()

def draw_instructions(screen):
    font = pygame.font.Font(None, 24)
    text1 = font.render("Правила головоломки:", True, BLACK)
    text2 = font.render("- В каждом квадрате должны быть соединены точки так, чтобы каждая", True, BLACK)
    text3 = font.render("  точка была частью одного угла.", True, BLACK)
    text4 = font.render("- Угол состоит из 1 точки, соединенной с 2 другими точками линиями равной длины.", True, BLACK)
    text5 = font.render("- Угол не может быть 180 градусов и пересекать другие углы.", True, BLACK)
    text6 = font.render("- Стороны, прилегающие к углу, должны быть равными.", True, BLACK)
    text7 = font.render("Нажмите для начала игры", True, BLACK)

    screen.blit(text1, (10, 10))
    screen.blit(text2, (10, 40))
    screen.blit(text3, (10, 70))
    screen.blit(text4, (10, 100))
    screen.blit(text5, (10, 130))
    screen.blit(text6, (10, 160))
    screen.blit(text7, (60, 500))

# Функция для отображения всплывающего сообщения
def show_message(screen, message):
    global game_over, puzzle_completed
    game_over = True
    puzzle_completed = True  # Устанавливаем флаг завершения головоломки
    screen.fill(WHITE)
    font = pygame.font.Font(None, 36)
    text = font.render(message, True, BLACK)
    text_rect = text.get_rect(center=(WIDTH // 2, HEIGHT // 2))
    screen.blit(text, text_rect)
    pygame.display.flip()
    pygame.time.delay(1000)  # Отображение сообщения на 1 секунду
    puzzle_completed = False  # Сброс флага завершения головоломки
    game_over = False  # Сброс флага завершения игры



# Функция для поиска ближайшей точки к заданным координатам
def find_closest_point(x, y):
    min_distance = float('inf')
    closest_point = None
    for point in points:
        if point not in selected_points:
            distance = math.sqrt((x - point[0]) ** 2 + (y - point[1]) ** 2)
            if distance < min_distance:
                min_distance = distance
                closest_point = point
    return closest_point

# Функция для проверки, можно ли создать угол с заданными точками
def can_create_angle(angle):
    if len(angle) != 3:
        return False
    a, b, c = angle

    # Проверка, что угол не является 180 градусов
    if math.isclose(math.dist(a, b), math.dist(b, c)):
        return False

    # Проверка, что угол не пересекает другие углы
    for existing_angle in angles:
        if do_angles_intersect(angle, existing_angle):
            return False

    # Проверка, что стороны прилегающие к углу равны
    if not math.isclose(math.dist(a, b), math.dist(a, c)):
        return False

    return True

# Проверка, пересекаются ли два угла
def do_angles_intersect(angle1, angle2):
    # Получаем координаты точек для каждого угла
    a1, b1, c1 = angle1
    a2, b2, c2 = angle2

    # Проверяем, пересекаются ли отрезки ab1 и ab2
    if do_segments_intersect(a1, b1, a2, b2):
        return True

    # Проверяем, пересекаются ли отрезки ab1 и ac2
    if do_segments_intersect(a1, b1, a2, c2):
        return True

    # Проверяем, пересекаются ли отрезки ac1 и ab2
    if do_segments_intersect(a1, c1, a2, b2):
        return True

    # Проверяем, пересекаются ли отрезки ac1 и ac2
    if do_segments_intersect(a1, c1, a2, c2):
        return True

    return False

# Проверка, пересекаются ли два отрезка
def do_segments_intersect(p1, p2, q1, q2):
    def orientation(p, q, r):
        val = (q[1] - p[1]) * (r[0] - q[0]) - (q[0] - p[0]) * (r[1] - q[1])
        if val == 0: return 0
        return 1 if val > 0 else 2

    o1 = orientation(p1, p2, q1)
    o2 = orientation(p1, p2, q2)
    o3 = orientation(q1, q2, p1)
    o4 = orientation(q1, q2, p2)

    if o1 != o2 and o3 != o4:
        return True

    if o1 == 0 and is_on_segment(p1, q1, p2): return True
    if o2 == 0 and is_on_segment(p1, q2, p2): return True
    if o3 == 0 and is_on_segment(q1, p1, q2): return True
    if o4 == 0 and is_on_segment(q1, p2, q2): return True

    return False

# Проверка, лежит ли точка q на отрезке pr
def is_on_segment(p, q, r):
    if ( (q[0] <= max(p[0], r[0])) and (q[0] >= min(p[0], r[0])) and
           (q[1] <= max(p[1], r[1])) and (q[1] >= min(p[1], r[1]))):
        return True
    return False

# Функция для проверки решения головоломки
def check_solution():
    global puzzle_completed
    if all(point in [p for angle in angles for p in angle] for point in points):
        show_message(screen, "Головоломка решена")

# Инициализация игры
def initialize_game():
    global points, angles, game_started, game_over, selected_points
    points = generate_points()  # Генерируем новые случайные точки
    angles.clear()
    selected_points = []
    game_over = False

# Отрисовка начального экрана
def draw_start_screen(screen):
    font = pygame.font.Font(None, 36)
    text = font.render("Нажмите для начала игры", True, BLACK)
    screen.blit(text, (120, 280))

# Отрисовка экрана завершения игры
def draw_game_over_screen(screen):
    font = pygame.font.Font(None, 36)
    text = font.render("Игра завершена!", True, BLACK)
    screen.blit(text, (200, 200))

    global restart_button, quit_button
    restart_button = pygame.Rect(200, 450, 200, 50)
    quit_button = pygame.Rect(200, 520, 200, 50)

    pygame.draw.rect(screen, RED, restart_button)
    pygame.draw.rect(screen, RED, quit_button)

    restart_text = font.render("Новая игра", True, WHITE)
    quit_text = font.render("Завершить", True, WHITE)

    screen.blit(restart_text, (270, 460))
    screen.blit(quit_text, (290, 530))

    mouse_pos = pygame.mouse.get_pos()
    if restart_button.collidepoint(mouse_pos):
        pygame.draw.rect(screen, BLACK, restart_button, 2)
    if quit_button.collidepoint(mouse_pos):
        pygame.draw.rect(screen, BLACK, quit_button, 2)

if __name__ == "__main__":
    initialize_game()
    main()
